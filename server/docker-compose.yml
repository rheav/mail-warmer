services:
  newsletters:
    build: .
    image: mail-warmer-server
    container_name: mail-warmer-server
    restart: unless-stopped
    ports:
      # host:container — change host port if 80 is taken on the VPS.
      - "80:80"
    # PORT defaults to 80 in the Dockerfile; the node binary has
    # cap_net_bind_service so it can bind the privileged port as non-root.
    environment:
      # Set a token to enable the dashboard list editor. Leave unset and the
      # API stays read-only (editing disabled).
      - ADMIN_TOKEN=change-me
    volumes:
      # Persists the analytics SQLite DB across rebuilds/redeploys.
      - analytics-db:/app/db
    # Optional: edit data/newsletters.json on the host and skip rebuilds.
    # The server watches the file and reloads within ~5s. Uncomment to use:
    #   - ./data:/app/data:ro

volumes:
  analytics-db:
