<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE0C2"/>
      <stop offset="1" stop-color="#FFB9A8"/>
    </linearGradient>
  </defs>

  <!-- rising warmth waves -->
  <path d="M36 16 C32 12 40 10 36 6" stroke="#F7B7A3" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M50 14 C46 10 54 8 50 4"  stroke="#F2A6A0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M64 16 C60 12 68 10 64 6"  stroke="#F7B7A3" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- envelope body -->
  <rect x="14" y="30" width="72" height="50" rx="12" fill="url(#warm)" stroke="#5A4A4E" stroke-width="4"/>

  <!-- flap (open, simple triangle) -->
  <path d="M16 36 L50 60 L84 36" stroke="#5A4A4E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- inner highlight under flap -->
  <path d="M16 36 L50 60 L84 36 L84 33 L50 56 L16 33 Z" fill="#FFF1E2" opacity="0.6"/>
</svg>
